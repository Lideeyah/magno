# Render blueprint.
#
# Builds from the repo root, matching ./Dockerfile. An earlier version set
# rootDir: backend, but that only takes effect for services created from this
# blueprint -- a service created by hand in the dashboard ignores the file and
# keeps failing with "failed to read dockerfile". The root build works on a
# default configuration either way.
services:
  - type: web
    name: magno-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health

    envVars:
      # The deployed frontend's origin. CORS is denied by default, so this has
      # to match the Vercel domain exactly, scheme included and no trailing
      # slash (the parser strips one, but be explicit).
      - key: MAGNO_CORS_ORIGINS
        value: https://magno-lideeyahs-projects.vercel.app

      # Prompted for on first deploy and never stored in the repo. Without it
      # the reasoner falls back to its deterministic policy rather than failing.
      - key: FEATHERLESS_API_KEY
        sync: false
