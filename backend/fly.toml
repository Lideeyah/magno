app = "magno-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  # Sessions and the in-memory audit ledger live in the process. A cold start
  # would drop every onboarded account, so the machine stays up.
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# One machine only. Session state is per-process, so a second instance would
# serve requests that cannot see the credentials the user onboarded with.
[deploy]
  strategy = "immediate"
